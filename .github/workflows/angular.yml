name: Validación Angular
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: angular-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  angular:
    name: Angular / validar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ReactivA
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: ReactivA/package-lock.json
      - run: npm ci
      - run: npm exec tsc -- --noEmit -p tsconfig.app.json
      - run: npm exec tsc -- --noEmit -p tsconfig.spec.json
      - run: npm test -- --watch=false
      - run: npm run build
