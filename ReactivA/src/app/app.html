<div class="app-layout" [class.no-sidebar]="isBareLayout()">
  @if (!isBareLayout()) {
    @if (isTeacherPage()) {
      <app-teacher-sidebar></app-teacher-sidebar>
    } @else {
      <app-sidebar></app-sidebar>
    }
  }

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
