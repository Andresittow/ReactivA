<div class="app-layout" [class.no-sidebar]="isAuthPage()">
  <!-- Las pantallas docentes comparten su propio sidebar. -->
  @if (!isAuthPage()) {
    @if (isTeacherPage()) {
      <app-teacher-sidebar></app-teacher-sidebar>
    } @else {
      <app-sidebar></app-sidebar>
    }
  }

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
