<aside class="sidebar" [class.collapsed]="isCollapsed">

  <!-- Cabecera de Marca: ReactivA -->
  <div class="brand">
    <div class="brand-info">
      <div class="logo-icon">
        <i class="ph ph-flask"></i>
      </div>
      @if (!isCollapsed) {
        <div class="brand-text">
          <h2>ReactivA</h2>
          <span>Plataforma de Química</span>
        </div>
      }
    </div>

    <!-- Botón Colapsar / Expandir -->
    <button
      type="button"
      class="btn-toggle"
      (click)="toggleSidebar()"
      [title]="isCollapsed ? 'Expandir menú' : 'Colapsar menú'"
      [attr.aria-label]="isCollapsed ? 'Expandir menú' : 'Colapsar menú'">
      <i class="ph" [class.ph-caret-left]="!isCollapsed" [class.ph-caret-right]="isCollapsed"></i>
    </button>
  </div>

  <!-- Navegación Principal -->
  <nav class="nav-menu">
    <ul>
      @for (item of menuItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            [title]="item.label">
            <i class="ph" [ngClass]="item.icon"></i>
            @if (!isCollapsed) {
              <span>{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Menú Inferior (Settings & Help) -->
  <div class="footer-menu">
    <ul>
      @for (item of footerMenuItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="onFooterClick(item)"
            [title]="item.label">
            <i class="ph" [ngClass]="item.icon"></i>
            @if (!isCollapsed) {
              <span>{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </div>

</aside>
